name: CI

on:
  push:
    branches: [main]
  pull_request:

# The job only reads the repository, so the token gets no write access.
permissions:
  contents: read

# A new push to a pull request cancels that PR's older run. Runs on main are never cancelled.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  server:
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: booking
          POSTGRES_PASSWORD: booking
          # The image creates this database on first start, so no separate "create database" step is needed.
          # Keep the name in sync with TEST_DATABASE_URL below; the test setup refuses names not ending in "_test".
          POSTGRES_DB: booking_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U booking -d booking_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      # Read by `npm test` and `npm run test:db:migrate`.
      TEST_DATABASE_URL: postgresql://booking:booking@localhost:5432/booking_test
      # prisma.config.ts requires DATABASE_URL even for `prisma generate`, which never connects. Pointing it at the
      # test database means nothing in this job can touch any other database.
      # JWT_SECRET, BCRYPT_COST etc. are set by src/test/setupEnv.ts, so they are deliberately not repeated here.
      DATABASE_URL: postgresql://booking:booking@localhost:5432/booking_test

    # Applies to `run` steps only, not `uses` steps.
    defaults:
      run:
        working-directory: server

    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node 24 with npm cache
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          # Relative to the repository root, because this is a `uses` step.
          cache-dependency-path: server/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Generate the Prisma client
        run: npm run db:generate

      - name: Apply migrations to the test database
        run: npm run test:db:migrate

      - name: Type-check
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Run tests
        run: npm test

  client:
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    # No environment variables and no database: the build does not read VITE_API_URL (the browser does, when the app
    # starts), and there are no client tests yet. Checked on a clean checkout without any .env file.
    # Applies to `run` steps only, not `uses` steps.
    defaults:
      run:
        working-directory: client

    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node 24 with npm cache
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          # Relative to the repository root, because this is a `uses` step. The client has its own lockfile.
          cache-dependency-path: client/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npm run typecheck

      # `npm run build` type-checks again, then bundles with Vite. The duplicate check costs a couple of seconds and
      # keeps this job's steps identical to what a developer runs locally.
      - name: Build
        run: npm run build
